    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: #0b1220; color: #e5e7eb; }
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
      .card { max-width: 720px; width: 100%; background: #0f172a; border: 1px solid #1f2937; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      h1 { margin: 0 0 8px; font-size: clamp(1.75rem, 3vw, 2.25rem); }
      p { margin: 0 0 16px; color: #cbd5e1; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
      a.button { display: inline-block; padding: 10px 14px; border-radius: 999px; text-decoration: none; background: #0ea5e9; color: white; border: 1px solid #0284c7; }
      a.ghost { background: transparent; color: #e5e7eb; border: 1px solid #334155; }
      form { margin-top: 12px; display: flex; gap: 8px; }
      input[type="text"] { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: #0b1220; color: #e5e7eb; }
      button[type="submit"] { padding: 10px 14px; border-radius: 10px; background: #1e293b; color: #e5e7eb; border: 1px solid #334155; cursor: pointer; }
      ul.links { list-style: none; padding: 0; margin: 16px 0 0; display: flex; gap: 10px; flex-wrap: wrap; }
      ul.links li a { color: #93c5fd; text-decoration: underline; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; background: #0b1220; padding: 2px 6px; border-radius: 6px; border: 1px solid #1f2937; }

  <body>
    <div class="wrap">
      <main class="card" role="main">
        <h1>404 — Page not found</h1>
        <p>
          Sorry, we couldn’t find that page. It may have moved or the URL could be mistyped.
        </p>
        <div class="actions">
          <a class="button" href="/">Go to homepage</a>
          <a class="button ghost" href="/#articles">Browse articles</a>
        </div>

        <form id="search" role="search" aria-label="Site search">
          <input id="q" type="text" name="q" placeholder="Search this site" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
        <noscript>
          <p>
            Search requires JavaScript. Alternatively, use this link:
            <a href="https://duckduckgo.com/?q=site%3Akachowska.github.io" rel="noopener">Search the site</a>.

        </noscript>

        <ul class="links" aria-label="Helpful links">

          <li><a href="/#skills">Skills</a></li>
          <li><a href="/#about">About</a></li>
          <li><a href="/#contact">Contact</a></li>
          <li><a href="/#articles">Articles</a></li>
        </ul>
      </main>
    </div>

    <script>
      (function() {
        var form = document.getElementById('search');
        if (!form) return;
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          var q = (document.getElementById('q').value || '').trim();
          var url = 'https://duckduckgo.com/?q=' + encodeURIComponent('site:kachowska.github.io ' + q);
          window.location.href = url;
        });
      })();
    </script>

    <script defer data-domain="kachowska.github.io" src="https://plausible.io/js/script.js"></script>
  </body>
